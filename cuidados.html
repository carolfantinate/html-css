<!DOCTYPE html>
<html lang="pt-br">

<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pangolin&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Pangolin&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
        }

        .logo {
            width: 280px;
            position: absolute;
            z-index: 2;
            top: 850px;
        }

        #nome-logo {
            width: 100px;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 400px;
            background-color: #ffd068;
        }

        nav a {
            padding: 7px;
            font-size: 18px;
            font-family: Arial, Helvetica, sans-serif;
            text-decoration: none;
            font-weight: bold;
            color: #96531c;
        }

        nav {
            display: flex;
            align-items: center;
        }

        ul {
            list-style: none;
        }

        .dropdown {
            float: left;
            overflow: hidden;
            margin-right: 10px;
        }

        .dropbtn {
            background-color: transparent;
            border: none;
            outline: none;
            font-size: 18px;
            font-family: Arial, Helvetica, sans-serif;
            color: #96531c;
            text-decoration: none;
            border-radius: 10px;
            padding: 10px;
            font-weight: bold;
        }

        .dropbtn:hover {
            background-color: #f4c358;
        }

        .navbar a:hover,
        .dropdown:hover .dropbtn {
            background-color: #f4c358;
        }

        .dropdown-content {
            display: none;
            border-radius: 10px;
            position: absolute;
            background-color: #ffdf9bd0;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .dropdown-content a {
            float: none;
            color: #96531c;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }

        .dropdown-content a:hover {
            background-color: #ffd068;
            border-radius: 5px;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        #user {
            font-size: 50px;
        }

        #btn-user {
            border-radius: 50%;
        }

        #nome {
            width: 270px;
            margin-top: 30px;
        }

        .main {
            display: flex;
            justify-content: center;
        }

        h2{
            font-family: "Poppins", sans-serif;
            text-align: center;
            color: #653712;
        }

        h3{
            font-family: "Poppins", sans-serif;
            text-align: center;
            color: #653712;
            margin-top: 30px;
        }

        p {
            width: 850px;
            text-align: justify;
            font-family: "Poppins", sans-serif;
            margin: auto;
        }

        ul {
            list-style: disc;
            width: 850px;
            text-align: justify;
            font-family: "Poppins", sans-serif;
            margin: auto;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_child_invert" />
    <link rel="stylesheet" href="nota.css">
    <title>Nuelo</title>
</head>

<body>
    <header>
        <img src="imgs/nome-logo.png" alt="" id="nome-logo">
        <nav>
            <button href="" class="dropbtn"><a href="../index.html">Home</a></button>
            <button href="#" class="dropbtn"><a href="">O que preciso?</a></button>
            <button href="#" class="dropbtn"><a href="">Puerpério</a></button>
            <div class="dropdown">
                <button class="dropbtn">Cuidados</button>
                <div class="dropdown-content">
                    <a href="">Alimentação</a>
                    <a href="">Sono</a>
                    <a href="">Cotidiano</a>
                </div>
            </div>
            <button href="" class="dropbtn"><a href="notas/diario.html">Diário</a></button>
            <button href="#" class="dropbtn" id="btn-user">
                <a href="">
                    <span class="material-symbols-outlined" id="user">account_child_invert</span>
                </a>
            </button>
        </nav>
    </header>

    <main>
        <div class="main"><img src="imgs/gestacao.png" alt="" id="nome"></div>

           
    </main>
</body>

</html>
